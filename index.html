<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>플레이리스트 프롬프트 키트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=Jua&display=swap">
<style>
  :root{
    --bg:#F6F5FA; --surface:#FFFFFF; --ink:#241F35; --muted:#6B6580; --faint:#9C96AE;
    --line:#E9E6F3; --line-strong:#D8D3E7; --accent:#FF5A87; --accent-soft:#FFE8EE;
    --shadow:0 2px 6px rgba(36,31,53,.06), 0 18px 36px -20px rgba(36,31,53,.3);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15131C; --surface:#1E1B28; --ink:#F2EFF8; --muted:#A9A1BE; --faint:#7F7794;
      --line:#312B3F; --line-strong:#473F5A; --accent:#FF7BA3; --accent-soft:#3A2130;
      --shadow:0 2px 6px rgba(0,0,0,.45), 0 18px 36px -20px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Gothic A1",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    display:grid;place-items:center;padding:24px 16px;
  }
  .card{
    width:100%;max-width:400px;background:var(--surface);
    border:1px solid var(--line);border-radius:22px;padding:30px 26px;
    box-shadow:var(--shadow);text-align:center;
  }
  .badge{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:5px 12px;border-radius:999px;margin-bottom:14px;
  }
  h1{font-family:"Jua",sans-serif;font-weight:400;font-size:26px;line-height:1.3;margin:0 0 8px}
  p.sub{margin:0 0 22px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  label{display:block;text-align:left;font-size:12.5px;font-weight:700;margin-bottom:7px}
  input{
    width:100%;font-family:inherit;font-size:16px;text-align:center;letter-spacing:.04em;
    color:var(--ink);background:var(--bg);border:2px solid var(--line-strong);
    border-radius:13px;padding:13px 14px;
  }
  input:focus{outline:none;border-color:var(--accent)}
  button{
    width:100%;margin-top:11px;font-family:inherit;font-size:15px;font-weight:700;
    color:#fff;background:var(--accent);border:0;border-radius:13px;padding:14px;
    cursor:pointer;box-shadow:0 8px 20px -10px var(--accent);
  }
  button:hover{filter:brightness(1.05)}
  button:disabled{opacity:.55;cursor:progress;box-shadow:none}
  .msg{margin:13px 0 0;font-size:12.5px;line-height:1.5;min-height:1.4em;color:var(--muted)}
  .msg.err{color:var(--accent);font-weight:700}
  .foot{margin:20px 0 0;font-size:11.5px;line-height:1.55;color:var(--faint)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Playlist Prompt Kit</span>
    <h1>비밀번호를 입력하세요</h1>
    <p class="sub">전달받은 비밀번호를 넣으면 앱이 열립니다.</p>
    <form id="f" autocomplete="off">
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" required>
      <button id="go" type="submit">열기</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p class="foot">비밀번호는 이 페이지를 만든 사람에게 받으세요.<br>내용은 암호화되어 있어 비밀번호 없이는 열리지 않습니다.</p>
  </main>

  var f = document.getElementById("f");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");

  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  if(!(window.crypto && crypto.subtle)){
    msg.textContent = "이 브라우저에서는 열 수 없습니다. 크롬·엣지·사파리 최신 버전에서 열어 주세요.";
    msg.className = "msg err";
    go.disabled = true;
    return;
  }

  f.addEventListener("submit", async function(e){
    e.preventDefault();
    var pass = pw.value;
    if(!pass) return;
    go.disabled = true;
    msg.className = "msg";
    msg.textContent = "여는 중…";
    try{
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.ct));
      var html = new TextDecoder().decode(plain);
      try{ sessionStorage.setItem("ppk_pw", pass); }catch(_){}
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      go.disabled = false;
      msg.className = "msg err";
      msg.textContent = "비밀번호가 맞지 않습니다.";
      pw.select();
    }
  });

  // 같은 탭에서 새로고침하면 다시 묻지 않는다
  try{
    var saved = sessionStorage.getItem("ppk_pw");
    if(saved){ pw.value = saved; f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit")); }
    else pw.focus();
  }catch(_){ pw.focus(); }
})();
